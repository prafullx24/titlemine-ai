name: Deploy to ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual execution

jobs:
  build:

    name: Build Image
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v2

      run: |
        echo "aws_key=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
        echo "aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
        ECR_REPOSITORY: title-mine/ocr_backend
        IMAGE_TAG: version1
      run: |
        docker build -t 051826709274.dkr.ecr.us-east-1.amazonaws.com/title-mine/ocr_backend:version1 .
        docker push 051826709274.dkr.ecr.us-east-1.amazonaws.com/title-mine/ocr_backend:version1

    - name: Deploy to ECS
      run: |
        aws ecs update-service \
          --cluster ocr_titlemine_cluster \
          --service ocr_service \
          --force-new-deployment
